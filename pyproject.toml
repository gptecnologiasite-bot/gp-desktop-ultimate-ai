[project]
name = "gp-desktop-ultimate-ai"
version = "1.0.0"
description = "GP Desktop Ultimate AI - aplicativo desktop profissional para Windows"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "psutil>=6.0",
  "supabase>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "keyring>=25.0",
  "cryptography>=42.0",
  "Pillow>=10.0",
  "pywin32>=306",
]

[project.scripts]
gp-desktop = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
